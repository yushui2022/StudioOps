<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudioOps</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL OPERATIONS CONSOLE</p>
          <h1>StudioOps</h1>
          <p class="muted">桌面端优先的 Mac 服务控制面板</p>
        </div>
        <div class="connection">
          <span id="connection-dot"></span
          ><span id="connection-text">连接中</span>
        </div>
      </header>

      <section class="grid metrics">
        <article class="card metric">
          <span>主机</span><strong id="hostname">—</strong
          ><small id="platform">—</small>
        </article>
        <article class="card metric">
          <span>运行时间</span><strong id="uptime">—</strong><small>系统</small>
        </article>
        <article class="card metric">
          <span>负载 / GPU</span><strong id="load">—</strong
          ><small>系统 1 分钟 · Apple Silicon</small>
        </article>
        <article class="card metric">
          <span>内存</span><strong id="memory">—</strong><small>已用比例</small>
        </article>
      </section>

      <section class="card services">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CONTROL PLANE</p>
            <h2>服务</h2>
          </div>
          <button id="refresh">刷新</button>
        </div>
        <div id="service-list" class="service-list">
          <p class="muted">加载中…</p>
        </div>
      </section>

      <section class="card activity">
        <div class="section-heading">
          <div>
            <p class="eyebrow">AUDIT TRAIL</p>
            <h2>最近操作</h2>
          </div>
          <span id="config-source" class="muted"></span>
          <button id="backup-config">备份配置</button>
        </div>
        <div id="event-list" class="event-list">
          <p class="muted">暂无操作记录</p>
        </div>
      </section>

      <section id="log-card" class="card logs hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">SERVICE LOG</p>
            <h2 id="log-title">日志</h2>
          </div>
          <button id="close-logs">关闭</button>
        </div>
        <pre id="log-output">加载中…</pre>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
