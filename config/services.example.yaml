# 服务清单会在 0.2 接入 schema 校验和 SQLite 状态库。
# target 是受控标识：launchd 用 job label，Docker 用 compose project，
# Ollama/ComfyUI 用固定 API 地址。客户端不能临时提交 target。
services:
  - id: my-node-project
    name: My Node Project
    kind: process
    group: 项目服务
    category: project
    adapter: process
    target: /Users/orlando/Projects/my-node-project
    command: npm
    args: [run, dev]
    cwd: /Users/orlando/Projects/my-node-project
    logFile: data/logs/my-node-project.log
    # 在项目页开放 Tailnet 入口后自动写入，例如 8443
    # tailscaleServePort: 8443
    allowedActions: [start, stop, restart, pause, resume]
    health:
      type: http
      endpoint: http://127.0.0.1:3000/health

  - id: ollama
    name: Ollama
    kind: ollama
    group: AI 服务
    category: ai
    adapter: process
    target: http://127.0.0.1:11434
    command: /Applications/Ollama.app/Contents/Resources/ollama
    args: [serve]
    port: 11434
    allowedActions: [start, stop, restart]
    health:
      type: http
      endpoint: http://127.0.0.1:11434/api/tags

  - id: my-compose-stack
    name: My Compose Stack
    kind: docker-compose
    group: 项目服务
    category: project
    adapter: docker-compose
    target: /Users/orlando/Projects/my-compose-stack/compose.yaml
    composeFile: /Users/orlando/Projects/my-compose-stack/compose.yaml
    projectName: my-compose-stack
    allowedActions: [start, stop, restart]
    health:
      type: tcp
      endpoint: tcp://127.0.0.1:8080

  - id: my-launchd-service
    name: My LaunchAgent
    kind: launchd
    group: 项目服务
    category: project
    adapter: launchd
    target: gui/501/com.example.my-service
    allowedActions: [start, stop, restart]
    logFile: data/logs/my-launchd-service.log

  - id: my-tunnel
    name: My Tunnel
    kind: tunnel
    group: 网络
    category: network
    adapter: launchd
    target: gui/501/com.example.my-tunnel
    allowedActions: [start, stop, restart]
    logFile: data/logs/my-tunnel.log
